[package]
name = "bazelqueue"
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A native per-user Bazel admission queue with foreground command semantics"
repository = "https://github.com/bitomule/bazelqueue"
homepage = "https://github.com/bitomule/bazelqueue"
default-run = "bazelqueue"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "process", "signal", "macros"] }
toml = "1"
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fixture-backend"
path = "tests/fixtures/backend.rs"
required-features = ["test-fixtures"]

[features]
test-fixtures = []

[profile.release]
lto = "thin"
strip = "symbols"

[lints.clippy]
all = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
